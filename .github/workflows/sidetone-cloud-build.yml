name: Sidetone Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sidetone-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load verified Sidetone source commit
        shell: bash
        run: |
          set -euo pipefail
          git bundle verify ./sidetone-candidate.bundle
          git fetch ./sidetone-candidate.bundle HEAD
          expected_source="$(cat sidetone-source.txt)"
          [[ "$expected_source" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse FETCH_HEAD)" = "$expected_source"
          git checkout --detach FETCH_HEAD
          test -z "$(git status --porcelain)"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build plugin, RadioHost, tests and installer
        shell: pwsh
        run: ./tools/build-sidetone.ps1 -UseStubReference -BuildInstaller
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sidetone-Windows-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
      - name: Preserve candidate installer
        uses: actions/upload-artifact@v4
        with:
          name: Sidetone-Windows-candidate
          path: |
            artifacts/Sidetone-Setup-*.exe
            artifacts/BUILD-REFERENCE.txt
            artifacts/build-manifest.json
            artifacts/SHA256.json
          if-no-files-found: error
